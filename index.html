#app{max-width:480px;margin:0 auto;padding:12px}
h1{text-align:center;margin:8px 0;font-size:22px}
.box{background:var(--card);border:3px solid var(--fg);border-radius:10px;padding:10px;margin:8px 0}
button{font:inherit;font-weight:bold;background:var(--ac);color:var(--bf);border:0;border-radius:8px;padding:9px 12px;margin:3px 3px 3px 0;cursor:pointer;touch-action:manipulation}
input{font:inherit;padding:8px;border:2px solid var(--fg);border-radius:8px;background:var(--card);color:var(--fg);width:70%;-webkit-user-select:text;user-select:text}
.sp{width:92px;height:92px;object-fit:contain;background:#fff;border-radius:8px;display:grid;place-items:center;font-size:56px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.bar{height:10px;border:2px solid var(--fg);border-radius:6px;overflow:hidden;background:var(--card)}.bar i{display:block;height:100%;background:#3fbf5f}
.tg{font-size:11px;border:1px solid var(--fg);border-radius:6px;padding:0 5px;margin-right:3px}
.card{cursor:pointer}
#cv{width:100%;aspect-ratio:11/9;border:3px solid var(--fg);border-radius:10px;image-rendering:pixelated;display:block;background:#2a6fc9;touch-action:none}
#cv.fl{animation:fl .45s}@keyframes fl{0%,50%,100%{filter:none}25%,75%{filter:invert(1)}}
.dp{display:grid;grid-template-columns:repeat(3,68px);justify-content:center;gap:6px;margin:8px 0}.dp button{height:52px;font-size:22px;margin:0;touch-action:none}
.arena{position:relative;height:300px;border:3px solid var(--fg);border-radius:10px;overflow:hidden;background:linear-gradient(var(--sky) 0 52%,#6fbf5a 52%);color:#1c2a1c}
.arena .sp{width:128px;height:128px;font-size:80px}
.arena .sp.cut{background:transparent;mix-blend-mode:multiply}
.arena .sp:not(.cut){border-radius:50%;object-fit:cover}
.fs,.ps{position:absolute}.fs{top:30px;right:14px}.ps{bottom:12px;left:14px}.ps .sp{transform:scaleX(-1)}
.sh{position:absolute;width:140px;height:26px;border-radius:50%;background:#0003}.sh.a{top:150px;right:8px}.sh.b{bottom:8px;left:8px}
.bx{position:absolute;background:#f6f9f0;border:3px solid #1c2a1c;border-radius:8px;padding:4px 8px;width:46%;font-size:13px}.bx.fb{top:8px;left:8px}.bx.pb{bottom:8px;right:8px}
.enter{animation:en .5s}@keyframes en{from{transform:translateX(60px);opacity:0}}
.shake{animation:sk .35s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ps.shake{animation:sk2 .35s}@keyframes sk2{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.log{min-height:70px}.mn{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mn button{margin:0}
